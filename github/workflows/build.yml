name: Build ThreeOneOSFive

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Xcode
      run: |
        sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
        xcode-select -p

    - name: Check Swift version
      run: swift --version

    - name: Install dependencies
      run: |
        which pod || gem install cocoapods

    - name: Create build directories
      run: |
        mkdir -p build/ipa
        mkdir -p build

    - name: Build project
      run: |
        xcodebuild \
          -project ThreeOneOSFive.xcodeproj \
          -scheme ThreeOneOSFive \
          -configuration Release \
          -sdk iphoneos \
          -arch arm64 \
          build \
          | xcpretty

    - name: Run tests
      continue-on-error: true
      run: |
        xcodebuild \
          -project ThreeOneOSFive.xcodeproj \
          -scheme ThreeOneOSFive \
          -configuration Debug \
          test 2>&1 || echo "Tests skipped or failed - continuing"

    - name: Archive
      run: |
        xcodebuild \
          -project ThreeOneOSFive.xcodeproj \
          -scheme ThreeOneOSFive \
          -configuration Release \
          -sdk iphoneos \
          -arch arm64 \
          archive \
          -archivePath ./build/ThreeOneOSFive.xcarchive \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO

    - name: Export IPA
      run: |
        xcodebuild \
          -exportArchive \
          -archivePath ./build/ThreeOneOSFive.xcarchive \
          -exportOptionsPlist ./ExportOptions.plist \
          -exportPath ./build/ipa \
          -allowProvisioningUpdates

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ThreeOneOSFive-IPA
        path: build/ipa/*.ipa

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: build/ipa/*.ipa
